<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Ergashev.dev — Control Center 2.0</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#090f1e;--panel:#151f33;--border:#293752;--txt:#edf4ff;--muted:#94a9c8;--blue:#78a9ff}*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,sans-serif;margin:0}header{position:sticky;top:0;background:#0b1427ef;backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:18px;z-index:5}.wrap{max-width:980px;margin:auto;padding:22px 16px 95px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:18px;font-weight:900;letter-spacing:-.5px}.brand span{color:var(--blue)}.pill{font-size:11px;border:1px solid #34547b;border-radius:100px;padding:7px 11px;color:#a8c8ff}h1{font-size:clamp(25px,5vw,37px);letter-spacing:-1px;margin:12px 0}h2{font-size:18px;margin:0 0 16px}.muted{color:var(--muted);line-height:1.6}.hero{background:radial-gradient(circle at 90% 5%,#35588b75,transparent 55%),linear-gradient(135deg,#1a2b49,#121d32);padding:26px;border:1px solid #32486c;border-radius:21px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:18px}.card strong{font-size:29px;display:block;margin:7px 0}.card small{color:var(--muted)}.tabs{display:flex;overflow:auto;gap:7px;margin:16px 0 18px;padding-bottom:4px}.tabs button{flex-shrink:0}.btn,button{font:inherit;cursor:pointer}.btn{border:1px solid #40516d;border-radius:10px;padding:11px 14px;background:#1d2a41;color:var(--txt);font-weight:650}.btn.primary{background:#75aaff;color:#08152c;border:0}.btn.danger{color:#ff9e9e;border-color:#754453}.btn.active{background:#75aaff;color:#0b1630}input,textarea,select{width:100%;border:1px solid #364760;border-radius:10px;background:#0d182a;color:#f4f8ff;padding:13px;font:inherit;outline:none}textarea{min-height:98px;resize:vertical}label{display:block;color:#b9cbe5;font-size:12px;margin:14px 0 7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.item{padding:15px 0;border-bottom:1px solid #29364b}.item:last-child{border-bottom:0}.item b{display:block;margin-bottom:6px}.item p{color:var(--muted);margin:0 0 10px;font-size:12px}.empty{padding:26px;text-align:center;color:var(--muted)}.note{border:1px solid #3b506c;background:#13233a;padding:13px;border-radius:12px;color:#afc7e6;font-size:12px;line-height:1.6;margin:15px 0}#toast{position:fixed;bottom:20px;left:16px;right:16px;max-width:700px;margin:auto;background:#243954;border:1px solid #6485ba;padding:14px;border-radius:12px;z-index:10;display:none}a{color:#a9c8ff}.hidden{display:none!important}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.wrap{padding-top:12px}}
</style></head><body><header><div class="top"><div class="brand">&lt;/&gt; ERGASHEV<span>.DEV</span></div><div class="pill">CONTROL CENTER · BETA</div></div></header><div class="wrap"><section class="hero"><div class="muted">PERSONAL CONTENT MANAGEMENT</div><h1>Admin Panel 2.0 ✨</h1><div class="muted">GitHub Pages + Telegram Bot. Ma’lumotlar GitHub’da, boshqaruv esa Telegram’da.</div></section><div class="cards"><div class="card">📂<strong id="countProjects">—</strong><small>Loyihalar</small></div><div class="card">📰<strong id="countBlogs">—</strong><small>Maqolalar</small></div><div class="card">🧩<strong id="countCommands">—</strong><small>Buyruqlar</small></div><div class="card">🔒<strong>Local</strong><small>Tokenlar botda</small></div></div><div id="mode" class="note">Ma’lumotlar yuklanmoqda...</div><nav class="tabs" id="tabs"><button class="btn active" data-tab="projects">📂 Loyihalar</button><button class="btn" data-tab="blogs">📰 Blog</button><button class="btn" data-tab="profile">👤 Profil</button><button class="btn" data-tab="design">🎨 Dizayn</button><button class="btn" data-tab="commands">🧩 Buyruqlar</button><button class="btn" data-tab="system">🔄 Tizim</button></nav><section class="panel" id="panel"></section></div><div id="toast"></div><script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}const BASE=new URL('../',location.href);let db={projects:[],blogs:[],profile:{},design:{theme:'blue',speed:60},commands:[]},tab='projects',editId=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3800)}
const isTelegram=!!tg?.initData;const canSend=typeof tg?.sendData==='function'&&isTelegram;
async function fetchData(){for(const [key,path,fallback] of [['projects','projects.json',[]],['blogs','blogs.json',[]],['profile','profile.json',{}],['design','site-config.json',{theme:'blue',speed:60}],['commands','commands.json',[]]]){try{const r=await fetch(new URL('data/'+path,BASE),{cache:'no-store'});db[key]=r.ok?await r.json():fallback}catch(e){db[key]=fallback}}$('countProjects').textContent=db.projects.length;$('countBlogs').textContent=db.blogs.length;$('countCommands').textContent=db.commands.length;$('mode').textContent=canSend?'Telegram ichida ochilgan. Saqlash bot ishlayotganida amalga oshadi.':'Ko‘rish rejimi: yozish uchun botdagi 🌐 Web Admin 2.0 klaviatura tugmasidan oching. Menu → Open orqali saqlash ishlamasligi mumkin.';render()}
function send(obj){if(!canSend){toast('Saqlash uchun botdagi Web Admin 2.0 klaviatura tugmasidan oching.');return}const raw=JSON.stringify(obj);if(new TextEncoder().encode(raw).length>3900){toast('Matn 3900 baytdan oshdi. Kichraytiring yoki bot chatidan yuboring.');return}if(!confirm('O‘zgarish GitHub’ga yozilsinmi?'))return;tg.sendData(raw)}
function field(id,label,value='',type='text'){return `<label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}">`}`}
function value(id){return $(id)?.value.trim()||''}function choose(t){tab=t;editId=null;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)choose(b.dataset.tab)});
function list(kind){const items=db[kind];return `<div class="row"><h2>${kind==='projects'?'📂 Loyihalar':'📰 Maqolalar'} (${items.length})</h2><button class="btn primary" id="newItem">+ Yangi</button></div>${items.length?items.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.category||'')} · ${esc(x.status||'published')}</p><div class="actions"><button class="btn" data-edit="${esc(x.id)}">✏️ Tahrirlash</button><button class="btn" data-action="${x.status==='hidden'?'publish':'hide'}" data-id="${esc(x.id)}">${x.status==='hidden'?'🚀 Nashr':'👁 Yashirish'}</button><button class="btn danger" data-action="delete" data-id="${esc(x.id)}">🗑 O‘chirish</button></div></div>`).join(''):'<div class="empty">Hozircha ma’lumot yo‘q.</div>'}`}
function form(kind,x={}){const project=kind==='projects';return `<div class="row"><h2>${x.id?'✏️ Tahrirlash':'➕ Yangi'} ${project?'loyiha':'maqola'}</h2><button class="btn" id="back">← Ro‘yxat</button></div>${field('title','Sarlavha',x.title)}${field('category','Kategoriya',x.category|| (project?'Web':'Blog'))}${project?field('summary','Qisqa tavsif',x.summary,'textarea')+field('description','Batafsil tavsif',x.description,'textarea')+field('tags','Texnologiyalar (vergul bilan)',(x.tags||[]).join(', '))+field('github_url','GitHub havolasi',x.github_url)+field('demo_url','Demo havolasi',x.demo_url):field('excerpt','Qisqa tavsif',x.excerpt,'textarea')+field('body','Maqola matni (3900 bayt cheklovini unutmang)',x.body,'textarea')}<div class="actions"><button class="btn primary" id="saveItem">💾 ${x.id?'Saqlash':'Yaratish'}</button><button class="btn" id="draftItem">📝 Qoralama</button></div><div class="note">Rasm yuklash uchun Telegram botdagi 👤 Avatar yoki eski loyiha qo‘shish jarayonidan foydalaning.</div>`}
function render(){const root=$('panel');if(tab==='projects'||tab==='blogs'){const kind=tab,items=db[kind],x=editId?items.find(x=>x.id===editId):null;root.innerHTML=editId===null?list(kind):form(kind,x||{});if(editId===null){$('newItem').onclick=()=>{editId='NEW';render()};root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render()});root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;if(action==='delete'&&!confirm('Rostdan ham o‘chirasizmi? Avval /backup olish tavsiya etiladi.'))return;send({kind,op:action,value:{id:b.dataset.id}})})}else{$('back').onclick=()=>{editId=null;render()};function save(status){const x={id:editId==='NEW'?'':editId,title:value('title'),category:value('category'),status};if(kind==='projects')Object.assign(x,{summary:value('summary'),description:value('description'),tags:value('tags').split(',').map(x=>x.trim()).filter(Boolean),github_url:value('github_url'),demo_url:value('demo_url')});else Object.assign(x,{excerpt:value('excerpt'),body:value('body')});if(!x.title)return toast('Sarlavha kiriting');send({kind,op:editId==='NEW'?'create':'update',value:x})}$('saveItem').onclick=()=>save('published');$('draftItem').onclick=()=>save('hidden')}return}
if(tab==='profile'){root.innerHTML=`<h2>👤 Profil</h2><div class="note">Profil rasmini Telegram botdagi 🚀 Pro Max 2.0 → 👤 Avatar orqali yuklang.</div>${field('site_title','Sayt nomi',db.profile.site_title)}${field('hero_description','Hero matni',db.profile.hero_description,'textarea')}${field('about_text','Men haqimda',db.profile.about_text,'textarea')}${field('github_url','GitHub',db.profile.github_url)}${field('contact_url','Aloqa',db.profile.contact_url)}<div class="actions"><button class="btn primary" id="saveProfile">💾 Saqlash</button></div>`;$('saveProfile').onclick=()=>send({kind:'profile',op:'update',value:Object.fromEntries(['site_title','hero_description','about_text','github_url','contact_url'].map(x=>[x,value(x)]))});return}
if(tab==='design'){root.innerHTML=`<h2>🎨 Theme Studio</h2><label>Mavzu</label><select id="theme"><option value="blue">Cyber Blue</option><option value="purple">Nebula Purple</option><option value="green">Matrix Green</option></select><label>Animatsiya tezligi: <span id="speedLabel"></span>%</label><input id="speed" type="range" min="0" max="100" value="${Number(db.design.speed)||60}"><div class="actions"><button class="btn primary" id="saveDesign">💾 Saytga qo‘llash</button></div>`;$('theme').value=db.design.theme||'blue';$('speed').oninput=()=>{$('speedLabel').textContent=$('speed').value};$('speed').oninput();$('saveDesign').onclick=()=>send({kind:'design',op:'update',value:{theme:value('theme'),speed:Number(value('speed'))}});return}
if(tab==='commands'){root.innerHTML=`<h2>🧩 Buyruqlar konstruktori</h2><div class="note">Bot chatida /newcommand buyrug‘idan foydalaning. Yangi buyruq javobi GitHub’da saqlanadi.</div>${db.commands.map(x=>`<div class="item"><b>/${esc(x.name)}</b><p>${esc(x.reply)}</p></div>`).join('')||'<div class="empty">Buyruqlar yo‘q</div>'}`;return}
root.innerHTML=`<h2>🔄 Tizim holati</h2><div class="note">GitHub JSON fayllari o‘qildi. Botning haqiqiy online holati faqat Telegram’da 🚀 Pro Max 2.0 → 🔄 Tizim holati orqali tekshiriladi.</div><p class="muted">💾 Backup: botdagi tugma<br>♻️ Restore: /restore<br>🧩 Buyruq yaratish: /newcommand<br>❌ Jarayonni bekor qilish: /cancel</p><div class="actions"><a class="btn" href="../" target="_blank">🌐 Saytni ochish ↗</a></div>`}
fetchData();
</script></body></html>
